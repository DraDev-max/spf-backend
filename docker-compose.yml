#
# put this file in the parent folder of both backend and frontend repositories
#
services:
  db:
    image: mysql:9.3
    container_name: spf-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: backend_api
    volumes:
      - spf-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    image: spf-backend:latest
    container_name: spf-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:@db:3306/backend_api
      JWT_SECRET: ""
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    image: spf-frontend:latest
    container_name: spf-frontend
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:3000/api
      SESSION_SECRET: ""
    ports:
      - "4000:4000"

volumes:
  spf-db-data:
